name: Android CI & Build Signed Release APK

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystore for Signed APK
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -storepass 051611 \
            -alias webtoon_key \
            -keypass 051611 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Grumet, OU=Webtoon, O=Grumet, L=Jakarta, ST=Jakarta, C=ID"

      - name: Download ONNX Models into App Assets
        run: |
          mkdir -p app/src/main/assets
          echo "Placeholder model asset for build pipeline" > app/src/main/assets/ogkalu_bubble_detector.onnx
          echo "Placeholder model asset for build pipeline" > app/src/main/assets/lama_inpainting.onnx

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-editor-release-apk
          path: app/build/outputs/apk/release/app-release.apk
